# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    com.nexigroup.pagopa.cruscotto: INFO
#    com.nexigroup.pagopa.cruscotto.config: DEBUG
#    # Logging per AWS SES
#    com.amazonaws.services.simpleemail: DEBUG
#    com.amazonaws.request: DEBUG
#    org.springframework.mail: DEBUG
#    jakarta.mail: TRACE
#    com.sun.mail: TRACE

spring:
  cloud:
    aws:
      credentials:
        access-key: awsAccessKey
        secret-key: awsSecretKey
      region:
        static: awsRegion
  devtools:
    restart:
      enabled: false
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  jpa:
    properties:
      hibernate:
        generate_statistics: false
    show-sql: true
  #       jdbc:
  #         batch_size: 50
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${ENV_DATASOURCE_URL:jdbc:postgresql://localhost:3306/cruscotto}
    username: ${ENV_DATASOURCE_USERNAME:qualification_dashboard}
    password: ${ENV_DATASOURCE_PASSWORD:qualification_dashboard}
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    # Remove 'faker' if you do not want the sample data to be loaded automatically
    contexts: ddl, dml, dev
    enabled: true
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false
  quartz:
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.dataSource: cruscotto
      org.quartz.dataSource.cruscotto.provider: hikaricp
      org.quartz.dataSource.cruscotto.driver: org.postgresql.Driver
      org.quartz.dataSource.cruscotto.URL: ${ENV_DATASOURCE_URL:jdbc:postgresql://localhost:3306/cruscotto}
      org.quartz.dataSource.cruscotto.user:  ${ENV_DATASOURCE_USERNAME:qualification_dashboard}
      org.quartz.dataSource.cruscotto.password: ${ENV_DATASOURCE_PASSWORD:qualification_dashboard}
      org.quartz.dataSource.cruscotto.validationQuery: select 1
      org.quartz.dataSource.cruscotto.maxConnections: 10
server:
  port: 8080
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

jhipster:
  cache: # Cache configuration
    ehcache: # Ehcache configuration
      time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache
      max-entries: 100 # Number of objects in each cache entry
  # CORS is only enabled by default with the "dev" profile
  cors:
    allowed-origins: '*'
    allowed-origin-patterns: '*'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        base64-secret: ${ENV_JWT_KEY:key}
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

azure:
  blob:
    connection-string: ${AZURE_BLOB_CONNECTION_STRING}
    container-name: ${AZURE_BLOB_CONTAINER_NAME:report}


application:
  mail:
    base-url: http://localhost:8080/
  aws:
    ses:
      user: awsSesUser
  enable-csrf: false
  password:
    day-password-expired: 60
    failed-login-attempts: 4
    hours-key-reset-password-expired: 1
  pago-pa-client:
    proxy-host:
    proxy-port:
    taxonomy:
      url: ${ENV_TAXONOMY_URL:http://localhost:8080/taxonomy/v1}
    back-office:
      url: ${ENV_BACK_OFFICE_URL:http://localhost:8080/back-office/v1}
      api-key-name: ${ENV_BACK_OFFICE_API_KEY_NAME:api-key-name}
      api-key-value: ${ENV_BACK_OFFICE_API_KEY_VALUE:api-key-value}
    cache:
      url: ${ENV_CACHE_URL:http://localhost:8080/back-office/v1}
      api-key-name: ${ENV_CACHE_API_KEY_NAME:api-key-name}
      api-key-value: ${ENV_CACHE_API_KEY_VALUE:api-key-value}
    stand-in:
      url: ${ENV_STAND_IN_URL:http://localhost:8080/technical-support/stand-in/api/v1}
      api-key-name: ${ENV_STAND_IN_API_KEY_NAME:api-key-name}
      api-key-value: ${ENV_STAND_IN_API_KEY_VALUE:api-key-value}
  auth-group:
    super-admin: NEXI
  job:
    load-taxonomy-job:
      enabled: true
      cron: 0 0/50 07-8 ? * SAT *
    load-maintenance-job:
      enabled: true
      cron: 0 0/50 07-8 ? * SAT *
    load-registry-job:
      enabled: true
      cron: 0 0/50 0-23 ? * SAT *
    kpi-a1-job:
      enabled: true
      cron: 0 0/15 08-23 ? * * *
      limit: 20
    kpi-a2-job:
      enabled: true
      cron: 0 1/15 08-23 ? * * *
      limit: 20
    kpi-b2-job:
      enabled: true
      cron: 0 2/15 08-23 ? * * *
      limit: 20
    kpi-b9-job:
      enabled: true
      cron: 0 3/15 08-23 ? * * *
      limit: 20
    kpi-b3-job:
      enabled: true
      cron: 0 4/15 08-23 ? * * *
      limit: 20
    kpi-b4-job:
      enabled: true
      cron: 0 5/15 08-23 ? * * *
      limit: 20
    kpi-b5-job:
      enabled: true
      cron: 0 6/15 08-23 ? * * *
      limit: 20
    kpi-c1-job:
      enabled: true
      cron: 0 7/15 08-23 ? * * *
      limit: 20
    kpi-b1-job:
      enabled: true
      cron: 0 8/15 08-23 ? * * *
      limit: 20
    kpi-b8-job:
      enabled: true
      cron: 0 9/15 08-23 ? * * *
      limit: 20
    kpi-b6-job:
      enabled: true
      cron: 0 10/15 08-23 ? * * *
      limit: 20
    kpi-c2-job:
      enabled: true
      cron: 0 11/15 08-23 ? * * *
      limit: 20

    load-stand-in-data-job:
      enabled: true
      cron-expression: 0 0 0 * * ? # Every day at midnight
      chunk-size-days: 10 # Number of days per chunk (default: 10)
      initialization-months: 6 # Number of months of historical data to load (default: 6)
      parallel-chunks: 3 # Number of chunks to process in parallel (default: 3)
      delay-between-chunk-starts-ms: 1000 # Delay between starting each chunk in milliseconds (default: 1000ms = 1 second)
      polling-interval-ms: 2000 # Polling interval to check job status in milliseconds (default: 2000ms = 2 seconds)
    clear-log-job:
      cron: 0 0/20 05-6 ? * MON,TUE,WED,THU,FRI,SAT,SUN *
      days: 7
    report-generation-job:
      enabled: true
      cron: 0 */10 * * * ? # Every 10 minutes

  liquibase:
    async-start: false
    dbVersion: 1.1.17

decorator:
  datasource:
    p6spy:
      multiline: true
      logging: slf4j
      enable-logging: false
